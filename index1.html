<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PİCO</title>
    <style>
        /* TEMALAR VE RENKLER */
        :root {
            --bg-deep: #050505;
            --table-grad: radial-gradient(circle at 50% 50%, #172a45 0%, #050505 80%);
            --text: #e2e8f0;
            --card-text: white;
            --red: #ef4444; --blue: #3b82f6; --green: #10b981; --yellow: #f59e0b;
            --menu-bg: rgba(0,0,0,0.7);
        }
        
        /* Koyu Temalar */
        body[data-theme="dark-1"] { --bg-deep: #050505; --table-grad: radial-gradient(circle at 50% 50%, #172a45 0%, #050505 80%); --text: #e2e8f0; } /* Lacivert (Default) */
        body[data-theme="dark-2"] { --bg-deep: #050000; --table-grad: radial-gradient(circle at 50% 50%, #451717 0%, #050000 80%); --text: #e2e8f0; } /* Koyu Kızıl */
        body[data-theme="dark-3"] { --bg-deep: #000500; --table-grad: radial-gradient(circle at 50% 50%, #174522 0%, #000500 80%); --text: #e2e8f0; } /* Orman Yeşili */
        body[data-theme="dark-4"] { --bg-deep: #050010; --table-grad: radial-gradient(circle at 50% 50%, #301745 0%, #050010 80%); --text: #e2e8f0; } /* Mor */
        body[data-theme="dark-5"] { --bg-deep: #000000; --table-grad: radial-gradient(circle at 50% 50%, #2c3e50 0%, #000000 80%); --text: #e2e8f0; } /* Karbon Siyah */
        
        /* Açık Temalar */
        body[data-theme="light-1"] { --bg-deep: #f0f8ff; --table-grad: radial-gradient(circle at 50% 50%, #87ceeb 0%, #f0f8ff 80%); --text: #1e293b; --menu-bg: rgba(255,255,255,0.8); } /* Gök Mavisi */
        body[data-theme="light-2"] { --bg-deep: #f0fff0; --table-grad: radial-gradient(circle at 50% 50%, #98ff98 0%, #f0fff0 80%); --text: #1e293b; --menu-bg: rgba(255,255,255,0.8); } /* Nane Yeşili */
        body[data-theme="light-3"] { --bg-deep: #fff5ee; --table-grad: radial-gradient(circle at 50% 50%, #ffdab9 0%, #fff5ee 80%); --text: #1e293b; --menu-bg: rgba(255,255,255,0.8); } /* Şeftali */
        body[data-theme="light-4"] { --bg-deep: #f8f8ff; --table-grad: radial-gradient(circle at 50% 50%, #e6e6fa 0%, #f8f8ff 80%); --text: #1e293b; --menu-bg: rgba(255,255,255,0.8); } /* Lavanta */
        body[data-theme="light-5"] { --bg-deep: #ffffff; --table-grad: radial-gradient(circle at 50% 50%, #cccccc 0%, #ffffff 80%); --text: #1e293b; --menu-bg: rgba(255,255,255,0.8); } /* Gümüş */

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: var(--table-grad); color: var(--text); overflow: hidden; height: 100vh; user-select: none; }

        /* GENEL MENÜ ARAYÜZÜ */
        .screen { position: absolute; width: 100%; height: 100%; z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; background: var(--table-grad); backdrop-filter: blur(10px); }
        .hidden { display: none !important; }
        h1 { font-size: clamp(3rem, 8vw, 5rem); margin-bottom: 20px; letter-spacing: 5px; text-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .menu-btn { padding: 12px 25px; margin: 8px; background: rgba(0,0,0,0.2); border: 2px solid var(--text); color: var(--text); cursor: pointer; border-radius: 8px; font-size: 1.1rem; font-weight: bold; transition: 0.3s; width: 280px; text-align: center; }
        .menu-btn:hover { background: var(--text); color: var(--bg-deep); transform: scale(1.05); }
        .menu-box { background: var(--menu-bg); padding: 30px; border-radius: 15px; border: 1px solid rgba(150,150,150,0.3); text-align: center; max-height: 90vh; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 0.9rem; margin-bottom: 5px; font-weight: bold; }
        .menu-input { padding: 10px; width: 100%; font-size: 1rem; border-radius: 5px; border: 1px solid #777; background: rgba(0,0,0,0.1); color: var(--text); }
        .row { display: flex; gap: 10px; } .col { flex: 1; }

        /* TOAST BİLDİRİMLERİ */
        #toast-container { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); z-index: 1000; display: flex; flex-direction: column; gap: 10px; }
        .toast { background: rgba(0,0,0,0.85); color: white; padding: 12px 25px; border-radius: 25px; font-weight: bold; font-size: 1.1rem; box-shadow: 0 5px 15px rgba(0,0,0,0.5); animation: slideDown 0.3s ease-out; border: 2px solid #334155; }
        .toast.error { border-color: #ef4444; color: #fca5a5; }
        .toast.success { border-color: #10b981; color: #a7f3d0; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }

        /* OYUN ALANI */
        #game-arena { position: relative; width: 100vw; height: 100vh; }
        #top-bar { position: absolute; top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; z-index: 30; }
        .top-btn { background: var(--menu-bg); color: var(--text); border: 1px solid rgba(150,150,150,0.3); padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; }

        /* RAKİPLER VE YERLEŞİM (Yarı Yarıya Üst Üste Binme) */
        .player-area { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 5px; z-index: 10; transition: 0.3s; }
        .player-info { display: flex; flex-direction: column; align-items: center; transition: 0.3s; padding: 5px; border-radius: 10px; }
        .player-name { background: rgba(0,0,0,0.6); color: white; padding: 4px 12px; border-radius: 12px; font-size: 0.85rem; font-weight: bold; border: 1px solid rgba(255,255,255,0.2); }
        .active-turn { box-shadow: 0 0 20px #60a5fa; background: rgba(96, 165, 250, 0.2); transform: scale(1.1); border-color: #60a5fa; }
        .active-turn .player-name { color: #60a5fa; border-color: #60a5fa; }
        
        .timer-bar-container { width: 100px; height: 6px; background: rgba(0,0,0,0.5); border-radius: 3px; overflow: hidden; display: none; margin-top: 3px; }
        .timer-bar { height: 100%; background: #10b981; transition: width 1s linear; }

        /* Bot Kart Yerleşimleri */
        .bot-cards-wrapper { display: flex; justify-content: center; align-items: center; }
        .bot-hand-horizontal { display: flex; flex-direction: row; }
        .bot-hand-horizontal .card-back { margin-left: -20px; } /* Üst Üste Binme */
        .bot-hand-horizontal .card-back:first-child { margin-left: 0; }
        
        #player-2 { top: 15px; left: 50%; transform: translateX(-50%); } /* ÜST BOT */
        
        /* SAĞ VE SOL BOTLAR (Döndürülmüş) */
        #player-1 { top: 50%; right: -20px; transform: translateY(-50%) rotate(-90deg); transform-origin: center; }
        #player-3 { top: 50%; left: -20px; transform: translateY(-50%) rotate(90deg); transform-origin: center; }
        #player-1 .player-info, #player-3 .player-info { transform: rotate(0deg); } /* İsmi düzeltmek için (opsiyonel) ama kalsın böyle daha iyi */

        /* KART TASARIMLARI (ESTETİK & HACİM) */
        .card { width: 75px; height: 110px; border-radius: 8px; border: 3px solid #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; box-shadow: 0 4px 10px rgba(0,0,0,0.5); background: #1e293b; color: var(--card-text); flex-shrink: 0; transition: transform 0.2s, box-shadow 0.2s; user-select: none; }
        .card.red { background: linear-gradient(135deg, #ef4444, #b91c1c); }
        .card.blue { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
        .card.green { background: linear-gradient(135deg, #10b981, #047857); }
        .card.yellow { background: linear-gradient(135deg, #f59e0b, #b45309); }
        .card.wild { background: conic-gradient(#ef4444 90deg, #3b82f6 90deg 180deg, #10b981 180deg 270deg, #f59e0b 270deg); }
        
        /* Köşe Rakamları ve Orta Elips */
        .corner-tl { position: absolute; top: 3px; left: 5px; font-size: 1rem; font-weight: bold; text-shadow: 1px 1px 2px black; }
        .corner-br { position: absolute; bottom: 3px; right: 5px; font-size: 1rem; font-weight: bold; transform: rotate(180deg); text-shadow: 1px 1px 2px black; }
        .card-ellipse { width: 75%; height: 60%; background: rgba(255, 255, 255, 0.2); border-radius: 50% / 40%; display: flex; justify-content: center; align-items: center; transform: rotate(-25deg); box-shadow: inset 0 2px 5px rgba(0,0,0,0.3); }
        .card-value { font-size: 2.2rem; font-weight: bold; color: white; text-shadow: 2px 2px 5px rgba(0,0,0,0.8); transform: rotate(25deg); }

        /* Kapalı Kart (PİCO Markalı Arka Yüz) */
        .card-back { width: 45px; height: 65px; border-radius: 5px; border: 2px solid #fff; background: repeating-linear-gradient(45deg, #1e293b, #1e293b 5px, #0f172a 5px, #0f172a 10px); display: flex; justify-content: center; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.5); position: relative; }
        .card-back::after { content: "PİCO"; position: absolute; font-weight: bold; font-size: 0.8rem; color: #ef4444; background: rgba(0,0,0,0.8); padding: 2px 5px; border-radius: 10px; transform: rotate(-25deg); border: 1px solid #ef4444; }

        /* BİZİM ALANIMIZ (Ekranın %20'si) */
        #player-0 { bottom: 10px; left: 50%; transform: translateX(-50%); width: 100%; }
        #my-cards { display: flex; gap: 0; justify-content: center; align-items: flex-end; height: 20vh; max-width: 95%; margin: 0 auto 10px auto; }
        #my-cards .card { height: 100%; max-height: 160px; width: auto; aspect-ratio: 75 / 110; margin-left: -10%; } /* Kartlar bizde de üst üste binsin biraz */
        #my-cards .card:first-child { margin-left: 0; }
        #my-cards .card:hover { transform: translateY(-15px); z-index: 20; }
        #my-cards .card.selected { transform: translateY(-25px) scale(1.05); border-color: #f59e0b; box-shadow: 0 0 20px #f59e0b; z-index: 25; }
        #my-cards .corner-tl, #my-cards .corner-br { font-size: clamp(0.8rem, 2vh, 1.5rem); }
        #my-cards .card-value { font-size: clamp(1.5rem, 4vh, 3rem); }

        /* ORTA ALAN VE HACİMLİ DESTE */
        #center-pile { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; gap: 30px; align-items: center; z-index: 5; }
        .stack-3d { box-shadow: 1px 1px 0 #fff, 2px 2px 0 #1e293b, 3px 3px 0 #fff, 4px 4px 0 #1e293b, 5px 5px 0 #fff, 6px 6px 10px rgba(0,0,0,0.6); }
        #deck.card { width: 85px; height: 125px; background: repeating-linear-gradient(45deg, #0f172a, #0f172a 8px, #1e293b 8px, #1e293b 16px); }
        #deck .card-ellipse { background: #ef4444; }
        #deck .card-value { font-size: 1.2rem; }
        #discard-pile { position: relative; width: 85px; height: 125px; }
        #discard-pile .card { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        /* KONTROLLER */
        #controls-row { display: flex; gap: 10px; align-items: center; justify-content: center; }
        .game-btn { padding: 12px 25px; font-size: 1.1rem; cursor: pointer; background: #334155; color: white; border: 2px solid #475569; border-radius: 8px; font-weight: bold; transition: 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .game-btn:hover { background: #475569; transform: scale(1.05); }
        #btn-play { background: #10b981; border-color: #059669; } #btn-play:hover { background: #059669; }
        #btn-pico { background: #ef4444; border-color: #b91c1c; } #btn-pico:hover { background: #dc2626; }

        /* Animasyon İçin Geçici Kart Sınıfı */
        .anim-card { position: absolute; z-index: 1000; transition: all 0.4s ease-in-out; pointer-events: none; }
    </style>
</head>
<body data-theme="dark-1">

    <!-- BİLDİRİM KONTEYNERİ -->
    <div id="toast-container"></div>

    <!-- ANA MENÜ -->
    <div id="main-menu" class="screen">
        <h1>PİCO</h1>
        <button class="menu-btn" onclick="openScreen('host-lobby')">Tek Oyuncu<br><span style="font-size:0.7em">(Botlara Karşı)</span></button>
        <button class="menu-btn" onclick="openScreen('online-menu')">Online Oyna</button>
        <button class="menu-btn" onclick="openScreen('settings-screen')">Kurallar ve Ayarlar</button>
        <button class="menu-btn" id="main-sound-btn" onclick="toggleSound()">Sesler: Açık</button>
    </div>

    <!-- ONLİNE MENÜ -->
    <div id="online-menu" class="screen hidden">
        <div class="menu-box">
            <h2 style="margin-bottom: 20px;">Online PİCO</h2>
            <button class="menu-btn" onclick="openScreen('host-lobby')">Oyun Kur (Host)</button>
            <button class="menu-btn" onclick="openScreen('join-lobby')">Oyuna Katıl</button>
            <button class="menu-btn" onclick="openScreen('main-menu')" style="background: #ef4444;">Geri Dön</button>
        </div>
    </div>

    <!-- KATILMA LOBİSİ -->
    <div id="join-lobby" class="screen hidden">
        <div class="menu-box">
            <h2>Oyuna Katıl</h2>
            <div class="input-group" style="margin-top:20px;">
                <label>Oda Kodu:</label>
                <input type="text" id="room-code-input" class="menu-input" placeholder="Örn: 5829">
            </div>
            <button class="menu-btn" style="background: #10b981;" onclick="joinSimulatedGame()">Katıl</button>
            <button class="menu-btn" onclick="openScreen('online-menu')" style="background: #ef4444;">Geri</button>
        </div>
    </div>

    <!-- OYUN KURMA (HOST) & SİNGLE PLAYER LOBİSİ -->
    <div id="host-lobby" class="screen hidden">
        <div class="menu-box">
            <h2 id="lobby-title">Oyun Lobisi</h2>
            <p id="room-code-display" style="color:#60a5fa; font-weight:bold; margin-bottom:15px; font-size:1.2rem; display:none;">Oda Kodu: <span id="random-code"></span></p>
            
            <div class="row">
                <div class="input-group col">
                    <label>Toplam Oyuncu (Bot Dahil):</label>
                    <select id="player-count" class="menu-input">
                        <option value="2">2 Kişi</option>
                        <option value="3">3 Kişi</option>
                        <option value="4" selected>4 Kişi</option>
                    </select>
                </div>
                <div class="input-group col">
                    <label>Bot Zorluğu:</label>
                    <select id="bot-diff" class="menu-input">
                        <option value="easy">Kolay (Şanslısın)</option>
                        <option value="normal" selected>Normal</option>
                        <option value="hard">Zor (Acımasız)</option>
                    </select>
                </div>
            </div>
            <p style="font-size:0.8rem; margin-bottom:15px; color:#aaa;">Kurallar "Ayarlar" sayfasındaki tercihlerinize göre oluşturulacaktır.</p>
            <button class="menu-btn" style="background: #10b981;" onclick="initGameSession()">Oyunu Başlat</button>
            <button class="menu-btn" onclick="openScreen('main-menu')" style="background: #ef4444;">İptal</button>
        </div>
    </div>

    <!-- AYARLAR VE KURALLAR -->
    <div id="settings-screen" class="screen hidden">
        <div class="menu-box" style="width: 90%; max-width: 400px;">
            <h2 style="margin-bottom: 15px;">Ayarlar</h2>
            
            <div class="input-group">
                <label>Oyuncu Adınız:</label>
                <input type="text" id="setting-name" class="menu-input" value="Sen">
            </div>
            
            <div class="input-group">
                <label>Oyun Teması:</label>
                <select id="setting-theme" class="menu-input" onchange="changeTheme()">
                    <option value="dark-1" selected>Koyu 1 (Lacivert - Default)</option>
                    <option value="dark-2">Koyu 2 (Kızıl)</option>
                    <option value="dark-3">Koyu 3 (Orman)</option>
                    <option value="dark-4">Koyu 4 (Mor)</option>
                    <option value="dark-5">Koyu 5 (Karbon)</option>
                    <option value="light-1">Açık 1 (Gök Mavisi)</option>
                    <option value="light-2">Açık 2 (Nane Yeşili)</option>
                    <option value="light-3">Açık 3 (Şeftali)</option>
                    <option value="light-4">Açık 4 (Lavanta)</option>
                    <option value="light-5">Açık 5 (Gümüş)</option>
                </select>
            </div>

            <h3 style="margin: 20px 0 10px 0; font-size:1.1rem; border-bottom:1px solid #777;">Özel Kurallar</h3>
            
            <div class="input-group row" style="align-items: center;">
                <input type="checkbox" id="rule-reverse" checked style="width:20px; height:20px;">
                <label style="margin:0; flex:1;">Yön Değiştirme Kartı (Renk Başına)</label>
                <input type="number" id="rule-reverse-count" class="menu-input" value="2" min="0" max="4" style="width:60px;">
            </div>
            
            <div class="input-group row" style="align-items: center;">
                <label style="margin:0; flex:1;">+2 Kartı (Renk Başına):</label>
                <input type="number" id="rule-plus2-count" class="menu-input" value="2" min="0" max="4" style="width:60px;">
                <span style="font-size:0.7rem; color:#aaa;">(Default: 2)</span>
            </div>

            <div class="input-group row" style="align-items: center;">
                <label style="margin:0; flex:1;">+4 Kartı (Deste Toplamı):</label>
                <input type="number" id="rule-plus4-count" class="menu-input" value="4" min="0" max="8" style="width:60px;">
                <span style="font-size:0.7rem; color:#aaa;">(Default: 4)</span>
            </div>

            <button class="menu-btn" onclick="saveSettings()" style="background: #10b981; margin-top:20px;">Kaydet ve Çık</button>
        </div>
    </div>

    <!-- DURAKLATMA EKRANI -->
    <div id="pause-overlay" class="screen hidden" style="z-index: 200;">
        <h2>Oyun Duraklatıldı</h2>
        <button class="menu-btn" onclick="resumeGame()">Devam Et</button>
        <button class="menu-btn" onclick="endGame()" style="background: #ef4444;">Ana Menüye Dön</button>
    </div>

    <!-- OYUN ALANI -->
    <div id="game-arena" class="hidden">
        <div id="top-bar">
            <button class="top-btn" onclick="pauseGame()">|| Menü</button>
            <button class="top-btn" id="game-sound-btn" onclick="toggleSound()">Ses: Açık</button>
        </div>
        
        <!-- Rakipler -->
        <div id="player-1" class="player-area">
            <div class="player-info" id="info-1">
                <div class="player-name" id="name-1">Bot 1</div>
                <div class="timer-bar-container" id="timer-box-1"><div class="timer-bar" id="timer-bar-1"></div></div>
            </div>
            <div class="bot-cards-wrapper bot-hand-horizontal" id="cards-1"></div>
        </div>
        
        <div id="player-2" class="player-area">
            <div class="player-info" id="info-2">
                <div class="player-name" id="name-2">Bot 2</div>
                <div class="timer-bar-container" id="timer-box-2"><div class="timer-bar" id="timer-bar-2"></div></div>
            </div>
            <div class="bot-cards-wrapper bot-hand-horizontal" id="cards-2"></div>
        </div>
        
        <div id="player-3" class="player-area">
            <div class="player-info" id="info-3">
                <div class="player-name" id="name-3">Bot 3</div>
                <div class="timer-bar-container" id="timer-box-3"><div class="timer-bar" id="timer-bar-3"></div></div>
            </div>
            <div class="bot-cards-wrapper bot-hand-horizontal" id="cards-3"></div>
        </div>

        <!-- Orta Deste ve Atılan Kart -->
        <div id="center-pile">
            <div class="card stack-3d" id="deck" onclick="userDrawCard()">
                <div class="card-ellipse"><span class="card-value">PİCO</span></div>
            </div>
            <div id="discard-pile" class="stack-3d"></div>
        </div>

        <!-- Bizim Alan -->
        <div id="player-0" class="player-area">
            <div class="player-info" id="info-0" style="margin-bottom: 5px;">
                <div class="player-name" id="name-0">Sen</div>
                <div class="timer-bar-container" id="timer-box-0" style="width: 150px;"><div class="timer-bar" id="timer-bar-0"></div></div>
            </div>
            
            <div id="my-cards"></div>
            
            <div id="controls-row">
                <button class="game-btn" id="btn-play" onclick="playSelectedCard()">Kartı At</button>
                <button class="game-btn" onclick="userDrawCard()">Kart Çek</button>
                <button class="game-btn" id="btn-pico" onclick="clickPico()">PİCO!</button>
            </div>
        </div>
    </div>

    <script>
        // --- SİSTEM DEĞİŞKENLERİ ---
        const colors = ['red', 'blue', 'green', 'yellow'];
        let deck = [], discardPile = [], hands = [[], [], [], []];
        let currentPlayer = 0, direction = 1, currentColor = 'blue';
        let picoClicked = [false, false, false, false];
        let gameActive = false, selectedCardIndex = -1;
        let soundEnabled = true, timeLeft = 15, timerInterval = null;
        
        // Ayarlar
        let maxPlayers = 4, myName = "Sen", difficulty = "normal";
        let rules = { reverse: true, revCount: 2, plus2Count: 2, plus4Count: 4 };

        // --- SES MOTORU ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (!soundEnabled || audioCtx.state === 'suspended') return;
            const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            if (type === 'deal') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'play') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'error') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            }
        }
        function toggleSound() {
            soundEnabled = !soundEnabled;
            let txt = soundEnabled ? "Ses: Açık" : "Ses: Kapalı";
            document.getElementById('main-sound-btn').innerText = "Sesler: " + (soundEnabled ? "Açık" : "Kapalı");
            document.getElementById('game-sound-btn').innerText = txt;
            if (soundEnabled && audioCtx.state === 'suspended') audioCtx.resume();
        }

        // --- ARAYÜZ YÖNETİMİ ---
        function openScreen(id) {
            document.querySelectorAll('.screen').forEach(el => el.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            if(id === 'host-lobby') document.getElementById('random-code').innerText = Math.floor(1000 + Math.random() * 9000);
        }
        function changeTheme() { document.body.setAttribute('data-theme', document.getElementById('setting-theme').value); }
        function saveSettings() {
            myName = document.getElementById('setting-name').value || "Sen";
            rules.reverse = document.getElementById('rule-reverse').checked;
            rules.revCount = parseInt(document.getElementById('rule-reverse-count').value);
            rules.plus2Count = parseInt(document.getElementById('rule-plus2-count').value);
            rules.plus4Count = parseInt(document.getElementById('rule-plus4-count').value);
            openScreen('main-menu');
            showToast("Ayarlar kaydedildi!", "success");
        }
        function showToast(msg, type="normal") {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`; toast.innerText = msg;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 2500);
        }

        // --- OYUN BAŞLATMA ---
        function joinSimulatedGame() {
            let code = document.getElementById('room-code-input').value;
            if(code.length < 4) return showToast("Geçerli bir kod girin!", "error");
            showToast("Odaya bağlanılıyor...", "success");
            setTimeout(() => { openScreen('host-lobby'); document.getElementById('lobby-title').innerText = "Oda: " + code; }, 1000);
        }
        
        function initGameSession() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            maxPlayers = parseInt(document.getElementById('player-count').value);
            difficulty = document.getElementById('bot-diff').value;
            document.querySelectorAll('.screen').forEach(el => el.classList.add('hidden'));
            document.getElementById('game-arena').classList.remove('hidden');
            gameActive = true; initGame();
        }

        function buildDeck() {
            deck = [];
            colors.forEach(c => {
                for (let i = 0; i <= 9; i++) { deck.push({ color: c, val: i.toString() }); deck.push({ color: c, val: i.toString() }); }
                if(rules.reverse) for(let i=0; i<rules.revCount; i++) deck.push({ color: c, val: '⇄' });
                for(let i=0; i<rules.plus2Count; i++) deck.push({ color: c, val: '+2' });
            });
            for(let i=0; i<rules.plus4Count; i++) deck.push({ color: 'wild', val: '+4' });
            deck.sort(() => Math.random() - 0.5);
        }

        function initGame() {
            buildDeck();
            hands = [[], [], [], []];
            for (let i = 0; i < 7; i++) { for (let p = 0; p < maxPlayers; p++) hands[p].push(deck.pop()); }

            let firstCard = deck.pop();
            while(['⇄', '+2', '+4'].includes(firstCard.val) || firstCard.color === 'wild') { deck.unshift(firstCard); firstCard = deck.pop(); }
            discardPile = [firstCard]; currentColor = firstCard.color;
            selectedCardIndex = -1; picoClicked = [false, false, false, false]; direction = 1;
            
            document.getElementById('name-0').innerText = myName;
            for(let i=1; i<=3; i++) {
                document.getElementById(`player-${i}`).style.display = (i < maxPlayers) ? 'flex' : 'none';
            }
            updateUI(); startTurn();
        }

        // --- ANİMASYON FONKSİYONU ---
        function animateCard(startEl, targetEl, htmlContent, callback) {
            if(!startEl || !targetEl) { callback(); return; }
            let rect1 = startEl.getBoundingClientRect(), rect2 = targetEl.getBoundingClientRect();
            let clone = document.createElement('div');
            clone.innerHTML = htmlContent; clone.className = 'anim-card';
            clone.style.left = rect1.left + 'px'; clone.style.top = rect1.top + 'px';
            document.body.appendChild(clone);
            
            setTimeout(() => { clone.style.left = rect2.left + 'px'; clone.style.top = rect2.top + 'px'; }, 20);
            setTimeout(() => { clone.remove(); callback(); }, 400);
        }

        // --- OYUN SIRASI VE ZAMANLAYICI ---
        function startTurn() {
            if (!gameActive) return;
            for (let i = 0; i < 4; i++) {
                let infoEl = document.getElementById(`info-${i}`);
                if(infoEl) infoEl.classList.toggle('active-turn', i === currentPlayer);
                let box = document.getElementById(`timer-box-${i}`);
                if(box) box.style.display = 'none';
            }

            let activeBox = document.getElementById(`timer-box-${currentPlayer}`);
            let activeBar = document.getElementById(`timer-bar-${currentPlayer}`);
            if(activeBox && activeBar) {
                activeBox.style.display = 'block'; activeBar.style.width = '100%'; activeBar.style.backgroundColor = '#10b981';
                timeLeft = 15; clearInterval(timerInterval);
                timerInterval = setInterval(() => {
                    timeLeft--; activeBar.style.width = ((timeLeft / 15) * 100) + '%';
                    if (timeLeft <= 5) activeBar.style.backgroundColor = '#ef4444';
                    if (timeLeft <= 0) { clearInterval(timerInterval); if (currentPlayer === 0) systemDraw(0); }
                }, 1000);
            }

            if (currentPlayer !== 0) {
                // Düşünme süresi animasyonu (Bazen 1-2sn, bazen 3-4sn)
                let thinkTime = Math.random() < 0.2 ? (3000 + Math.random()*1500) : (1000 + Math.random()*1000);
                setTimeout(botPlay, thinkTime);
            }
        }

        // --- KART OYNAMA MANTIĞI ---
        function selectCard(idx) {
            if (currentPlayer !== 0) return;
            selectedCardIndex = (selectedCardIndex === idx) ? -1 : idx;
            updateUI();
        }

        function playSelectedCard() {
            if (currentPlayer !== 0 || selectedCardIndex === -1) return;
            let card = hands[0][selectedCardIndex];
            if (isValidPlay(card)) {
                if (hands[0].length === 2 && !picoClicked[0]) {
                    playSound('error'); showToast("PİCO demeyi unuttun! Ceza kartı çektin.", "error");
                    systemDraw(0); selectedCardIndex = -1; nextTurn(); return;
                }
                executePlay(0, selectedCardIndex);
            } else { playSound('error'); showToast("Bu kartı atamazsın!", "error"); }
        }

        function isValidPlay(card) {
            let topCard = discardPile[discardPile.length - 1];
            return card.color === 'wild' || card.color === currentColor || card.val === topCard.val;
        }

        function executePlay(pIndex, cardIndex) {
            clearInterval(timerInterval);
            let card = hands[pIndex].splice(cardIndex, 1)[0];
            selectedCardIndex = -1;
            
            // Animasyon Hedeferi
            let startEl = pIndex === 0 ? document.getElementById('my-cards').children[cardIndex] : document.getElementById(`cards-${pIndex}`);
            let targetEl = document.getElementById('discard-pile');
            let htmlStr = getCardHTML(card);
            
            playSound('play');
            animateCard(startEl, targetEl, htmlStr, () => {
                discardPile.push(card);
                if(card.color !== 'wild') currentColor = card.color;
                else currentColor = colors[Math.floor(Math.random() * colors.length)]; // Otomatik renk seç (basitlik için)
                
                picoClicked[pIndex] = false;
                if (hands[pIndex].length === 0) {
                    showToast(pIndex === 0 ? "Tebrikler, Kazandın!" : `Oyun Bitti! Kazanan: ${document.getElementById(`name-${pIndex}`).innerText}`, "success");
                    setTimeout(endGame, 3000); return;
                }
                
                // Özel Kart Etkileri
                let skipTurn = false;
                if (card.val === '⇄') { direction *= -1; showToast("Yön Değişti!"); }
                else if (card.val === '+2') { 
                    let nextP = (currentPlayer + direction + maxPlayers) % maxPlayers;
                    systemDraw(nextP, 2, false); skipTurn = true; showToast("+2 Kart Çektirildi!");
                }
                else if (card.val === '+4') {
                    let nextP = (currentPlayer + direction + maxPlayers) % maxPlayers;
                    systemDraw(nextP, 4, false); skipTurn = true; showToast("+4 Kart Çektirildi!");
                }
                
                updateUI();
                if(skipTurn) { currentPlayer = (currentPlayer + direction + maxPlayers) % maxPlayers; }
                nextTurn();
            });
        }

        function userDrawCard() {
            if(currentPlayer !== 0) return;
            clearInterval(timerInterval);
            systemDraw(0, 1, true, () => { nextTurn(); });
        }

        function systemDraw(pIndex, amount = 1, forceAnim = true, cb = null) {
            let drawn = 0;
            function drawOne() {
                if(drawn >= amount) { if(cb) cb(); updateUI(); return; }
                if(deck.length === 0) { let top=discardPile.pop(); deck=discardPile; discardPile=[top]; deck.sort(()=>Math.random()-0.5); }
                
                let newCard = deck.pop();
                
                // Kolay mod şansı (Oyuncu çekiyorsa)
                if(pIndex === 0 && difficulty === 'easy' && !isValidPlay(newCard) && Math.random() < 0.5) {
                    let goodIdx = deck.findIndex(c => isValidPlay(c));
                    if(goodIdx > -1) { deck.push(newCard); newCard = deck.splice(goodIdx, 1)[0]; }
                }

                hands[pIndex].push(newCard);
                playSound('deal');
                
                if(forceAnim) {
                    let targetEl = pIndex === 0 ? document.getElementById('my-cards') : document.getElementById(`cards-${pIndex}`);
                    animateCard(document.getElementById('deck'), targetEl, '<div class="card-back"></div>', () => { drawn++; drawOne(); });
                } else { drawn++; drawOne(); }
            }
            drawOne();
        }

        function clickPico() {
            if (currentPlayer === 0 && hands[0].length <= 2) {
                picoClicked[0] = true; playSound('play'); showToast("PİCO deklare edildi!", "success");
            } else if(currentPlayer === 0) { showToast("Şu an PİCO diyemezsin!", "error"); playSound('error'); }
        }

        function botPlay() {
            if (!gameActive || currentPlayer === 0) return;
            let botHand = hands[currentPlayer];
            
            // Zorluğa göre PİCO unutma şansı
            let forgetChance = difficulty === 'easy' ? 0.3 : (difficulty === 'normal' ? 0.15 : 0.0);
            if (botHand.length === 2 && Math.random() > forgetChance) picoClicked[currentPlayer] = true;

            let cardIdx = botHand.findIndex(c => isValidPlay(c));
            
            // Zor modda, eğer senin az kartın varsa +2/+4 atmaya çalışır
            if(difficulty === 'hard' && hands[0].length <= 2) {
                let attackIdx = botHand.findIndex(c => c.val === '+2' || c.val === '+4');
                if(attackIdx > -1 && isValidPlay(botHand[attackIdx])) cardIdx = attackIdx;
            }

            if (cardIdx > -1) {
                if (botHand.length === 1 && !picoClicked[currentPlayer]) {
                    showToast(`Bot PİCO demeyi unuttu!`, "error");
                    systemDraw(currentPlayer, 1, false);
                }
                executePlay(currentPlayer, cardIdx);
            } else {
                systemDraw(currentPlayer, 1, true, () => { nextTurn(); });
            }
        }

        function nextTurn() {
            currentPlayer = (currentPlayer + direction + maxPlayers) % maxPlayers;
            updateUI(); startTurn();
        }

        // --- RENDER ---
        function getCardHTML(c, isHand = false, idx = -1) {
            let selClass = (isHand && idx === selectedCardIndex) ? 'selected' : '';
            let click = isHand ? `onclick="selectCard(${idx})"` : '';
            let val = c.val;
            let bgClass = c.color === 'wild' ? 'wild' : c.color;
            return `
                <div class="card ${bgClass} ${selClass}" ${click}>
                    <span class="corner-tl">${val}</span>
                    <div class="card-ellipse"><span class="card-value">${val}</span></div>
                    <span class="corner-br">${val}</span>
                </div>
            `;
        }

        function updateUI() {
            // Bizim Kartlar
            document.getElementById('my-cards').innerHTML = hands[0].map((c, i) => getCardHTML(c, true, i)).join('');
            
            // Bot Kartları (Kapalı)
            for (let i = 1; i <= 3; i++) {
                if (i < maxPlayers) {
                    let html = hands[i].map(() => `<div class="card-back"></div>`).join('');
                    document.getElementById(`cards-${i}`).innerHTML = html;
                }
            }

            // Atılan Kart ve Deste (Sadece 1 kart göster, hacim CSS shadow ile sağlanıyor)
            let topCard = discardPile[discardPile.length - 1];
            document.getElementById('discard-pile').innerHTML = getCardHTML(topCard);
        }

        // --- DURAKLATMA / ÇIKIŞ ---
        function pauseGame() { gameActive = false; clearInterval(timerInterval); document.getElementById('pause-overlay').classList.remove('hidden'); }
        function resumeGame() { document.getElementById('pause-overlay').classList.add('hidden'); gameActive = true; startTurn(); }
        function endGame() {
            clearInterval(timerInterval); gameActive = false;
            document.getElementById('pause-overlay').classList.add('hidden');
            document.getElementById('game-arena').classList.add('hidden');
            openScreen('main-menu');
        }
    </script>
</body>
</html>
